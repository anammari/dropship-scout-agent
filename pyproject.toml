[project]
name = "dropship-scout-agent"
version = "0.1.0"
description = "Supplier-first dropshipping product scout: live supplier extraction (CJdropshipping MCP, AliExpress Dropshipping Center, Etsy API), LLM filtering, and Shopify workspace export."
requires-python = ">=3.11"
# Pinned to the versions verified working in .venv (see _docs/plan.md,
# "Environment Setup").
# playwright-stealth MUST stay >=2.0: v2 exposes the `Stealth` class API;
# the v1 `stealth_async()` free function no longer exists.
dependencies = [
    "playwright==1.62.0",
    "playwright-stealth==2.0.3",
    "instructor==1.16.0",
    "openai==2.54.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    # Pixel-dimension decoding for the image validation gates — never trust
    # HTML width/height attributes; decode the downloaded bytes themselves.
    "pillow>=11.0",
    "python-dotenv==1.2.3",
    # Official MCP Python SDK — StreamableHTTP client for the remote
    # CJdropshipping MCP server (src/pipeline/cj_mcp_client.py).
    "mcp==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"